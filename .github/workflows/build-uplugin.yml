name: Build Unreal Plugin

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "unreal/plugin/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/build-uplugin.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_version:
        description: "dcc-mcp-core release tag/version to download, for example v0.17.20"
        required: false
        default: "latest"

concurrency:
  group: build-uplugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-uplugin:
    # Unreal Engine is not installed on GitHub-hosted runners. Use a Windows
    # self-hosted runner with UE and VS Build Tools installed. The repository
    # runner `ue-builder` currently exposes the default labels below.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - ue_version: "5.7"
            ue_root: C:\Program Files\Epic Games\UE_5.7
            package_mode: native
            artifact_suffix: win64
          - ue_version: "5.2"
            ue_root: C:\Program Files\Epic Games\UE_5.2
            package_mode: native
            artifact_suffix: win64
            vctoolchain_version: "14.36"
          - ue_version: "4.18"
            ue_root: C:\Program Files\Epic Games\UE_4.18
            package_mode: python-only
            artifact_suffix: python-only
    env:
      UE_VERSION: ${{ matrix.ue_version }}
      UE_ROOT: ${{ matrix.ue_root }}
      DCC_MCP_UNREAL_PACKAGE_MODE: ${{ matrix.package_mode }}
      VCTOOLCHAIN_VERSION: ${{ matrix.vctoolchain_version || '' }}
      MSVC_14_36_COMPONENT: Microsoft.VisualStudio.Component.VC.14.36.17.6.x86.x64
      CORE_REPO: loonghao/dcc-mcp-core
      CORE_VERSION: ${{ github.event.inputs.core_version || 'latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        shell: pwsh
        run: |
          $pythonVersion = "3.12.10"
          $installDir = "$env:RUNNER_TEMP\python\$pythonVersion"
          if (-not (Test-Path "$installDir\python.exe")) {
            # Use python.org embeddable zip — no installer, no registry access needed
            $zipUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
            $zipPath = "$env:RUNNER_TEMP\python-$pythonVersion-embed-amd64.zip"
            Write-Host "Downloading Python $pythonVersion embeddable from python.org"
            Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
            Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
            Remove-Item $zipPath
            # Enable site module in .pth to allow site-packages (required for pip)
            Get-ChildItem "$installDir" -Filter "python*._pth" | ForEach-Object {
              $content = Get-Content $_.FullName
              if (-not ($content -match "^import site$")) {
                $content -replace "^#import site$", "import site" | Set-Content $_.FullName
              }
            }
            # Bootstrap pip via get-pip.py (ensurepip not available in embeddable)
            Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$installDir\get-pip.py" -UseBasicParsing
            & "$installDir\python.exe" "$installDir\get-pip.py"
            if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed (exit code $LASTEXITCODE)" }
            Remove-Item "$installDir\get-pip.py" -Force -ErrorAction SilentlyContinue
          }
          "PYTHON_HOME=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Python $pythonVersion ready at $installDir"

      - name: Install Python build tools
        shell: pwsh
        run: |
          & "$env:PYTHON_HOME\python.exe" -m pip install --upgrade pip
          & "$env:PYTHON_HOME\python.exe" -m pip install hatchling build pyyaml ruff pytest editables

      - name: Install dcc-mcp-unreal
        shell: pwsh
        run: |
          & "$env:PYTHON_HOME\python.exe" -m pip install -e ".[dev]"

      - name: Validate Python package and skills
        shell: pwsh
        run: |
          & "$env:PYTHON_HOME\python.exe" tools/lint_skills.py --error-only
          & "$env:PYTHON_HOME\python.exe" -m ruff check src tests unreal/plugin/Content/Python
          & "$env:PYTHON_HOME\python.exe" -m pytest

      - name: Download dcc-mcp-core wheel from release
        id: core
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DCC_MCP_CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/core-wheel | Out-Null
          $tag = "${env:CORE_VERSION}"
          if ($tag -eq "" -or $tag -eq "latest") {
            gh release download --repo "${env:CORE_REPO}" --pattern "dcc_mcp_core_semantic-*-cp38-abi3-win_amd64.whl" --dir dist/core-wheel --clobber
          } else {
            gh release download $tag --repo "${env:CORE_REPO}" --pattern "dcc_mcp_core_semantic-*-cp38-abi3-win_amd64.whl" --dir dist/core-wheel --clobber
          }
          $wheel = Get-ChildItem dist/core-wheel -Filter "dcc_mcp_core_semantic-*-cp38-abi3-win_amd64.whl" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          # PyPI fallback when GitHub Release doesn't have the wheel yet (timing race)
          if ($null -eq $wheel) {
            Write-Host "::warning::dcc-mcp-core wheel not found in GitHub Release; falling back to PyPI"
            $pipVersion = ""
            if ($tag -eq "" -or $tag -eq "latest") {
              $latestTag = gh release view --repo "${env:CORE_REPO}" --json tagName -q '.tagName'
              $pipVersion = $latestTag -replace "^v", ""
            } else {
              $pipVersion = $tag -replace "^v", ""
            }
            & "$env:PYTHON_HOME\python.exe" -m pip download "dcc-mcp-core-semantic==$pipVersion" --only-binary=:all: --platform win_amd64 --python-version 3.8 --dest dist/core-wheel
            $wheel = Get-ChildItem dist/core-wheel -Filter "dcc_mcp_core_semantic-*-cp38-abi3-win_amd64.whl" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if ($null -eq $wheel) { throw "dcc-mcp-core wheel was not downloaded from GitHub Release or PyPI" }
          "wheel=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Using core wheel: $($wheel.FullName)"


      - name: Ensure MSVC 14.36 toolchain (UE 5.2)
        if: matrix.vctoolchain_version != ''
        shell: pwsh
        run: |
          $msvcVersion = "14.36"
          $vsToolsRoot = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
          $vsToolchainRoot = "$vsToolsRoot\VC\Tools\MSVC"
          $msvcTargetDir = "C:\msvc-kit\$msvcVersion"
          $msvcKitExe = "C:\msvc-kit\bin\msvc-kit.exe"

          # Step 1: Check if MSVC 14.36 is registered with VS (UBT-discoverable)
          $registered = $false
          if (Test-Path $vsToolchainRoot) {
            $existing = Get-ChildItem $vsToolchainRoot -Directory |
              Where-Object { $_.Name -like "$msvcVersion.*" }
            if ($existing) {
              Write-Host "MSVC $msvcVersion toolchain already registered with VS: $($existing.FullName)"
              $registered = $true
            }
          }

          # Step 2: Install via VS installer if not registered
          if (-not $registered) {
            $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (Test-Path $vsInstaller) {
              Write-Host "Installing MSVC $msvcVersion component via VS installer..."
              & $vsInstaller modify --installPath "$vsToolsRoot" `
                --add "Microsoft.VisualStudio.Component.VC.14.36.17.6.x86.x64" `
                --passive --norestart --wait
              $vsExitCode = $LASTEXITCODE
              if ($vsExitCode -eq 0 -or $vsExitCode -eq 3010) {
                Write-Host "MSVC $msvcVersion component installed (exit code $vsExitCode)"
                if (Test-Path $vsToolchainRoot) {
                  $existing = Get-ChildItem $vsToolchainRoot -Directory |
                    Where-Object { $_.Name -like "$msvcVersion.*" }
                  if ($existing) {
                    Write-Host "Confirmed: MSVC $msvcVersion registered at $($existing.FullName)"
                    $registered = $true
                  }
                }
              } else {
                Write-Host "VS installer exited with code $vsExitCode; msvc-kit fallback"
              }
            } else {
              Write-Host "VS installer not found; using msvc-kit"
            }
          }

          # Step 3: Fallback -- msvc-kit download + VS junction registration
          if (-not $registered) {
            if ((Test-Path "$msvcTargetDir\VC\Tools\MSVC") -and
                (Get-ChildItem "$msvcTargetDir\VC\Tools\MSVC" -Directory |
                  Where-Object { $_.Name -like "$msvcVersion.*" })) {
              Write-Host "MSVC $msvcVersion toolchain already present at $msvcTargetDir"
            } else {
              $msvcKitVersion = "v0.2.13"
              $needDownload = $false
              if (Test-Path $msvcKitExe) {
                try {
                  $currentVersion = & $msvcKitExe --version 2>$null
                  if ($LASTEXITCODE -eq 0 -and $currentVersion -match $msvcKitVersion) {
                    Write-Host "msvc-kit $msvcKitVersion already present at $msvcKitExe"
                    $needDownload = $false
                  } else {
                    Write-Host "msvc-kit version mismatch; re-downloading $msvcKitVersion..."
                    $needDownload = $true
                  }
                } catch {
                  Write-Host "Failed to check msvc-kit version; re-downloading..."
                  $needDownload = $true
                }
              } else {
                $needDownload = $true
              }
              if ($needDownload) {
                Remove-Item $msvcKitExe -Force -ErrorAction SilentlyContinue
                Write-Host "Downloading msvc-kit $msvcKitVersion..."
                New-Item -ItemType Directory -Force -Path "C:\msvc-kit\bin" | Out-Null
                $exeUrl = "https://github.com/loonghao/msvc-kit/releases/download/$msvcKitVersion/msvc-kit-x86_64-windows.exe"
                Invoke-WebRequest -Uri $exeUrl -OutFile $msvcKitExe -UseBasicParsing
                Write-Host "msvc-kit $msvcKitVersion installed at $msvcKitExe"
              }
              Write-Host "Downloading MSVC $msvcVersion toolchain via msvc-kit..."
              & $msvcKitExe download --msvc-version $msvcVersion --no-sdk --dir $msvcTargetDir --arch x64
              if ($LASTEXITCODE -ne 0) { throw "msvc-kit download failed (exit code $LASTEXITCODE)" }
              Write-Host "MSVC $msvcVersion toolchain downloaded to $msvcTargetDir"
            }

            # Register msvc-kit toolchain with VS via directory junction or copy
            $kitToolchainRoot = "$msvcTargetDir\VC\Tools\MSVC"
            if ((Test-Path $kitToolchainRoot) -and (Test-Path $vsToolchainRoot)) {
              Get-ChildItem $kitToolchainRoot | ForEach-Object {
                $target = Join-Path $vsToolchainRoot $_.Name
                if (-not (Test-Path $target)) {
                  $reg = $false
                  try {
                    New-Item -ItemType Junction -Path $target -Target $_.FullName -Force -ErrorAction Stop | Out-Null
                    Write-Host "Registered $($_.Name) with VS via junction (UBT-discoverable)"
                    $reg = $true
                  } catch {
                    Write-Host "Junction failed ($_); trying copy fallback..."
                  }
                  if (-not $reg) {
                    try {
                      Copy-Item -Path $_.FullName -Destination $target -Recurse -Force -ErrorAction Stop
                      Write-Host "Registered $($_.Name) with VS via copy (UBT-discoverable)"
                    } catch {
                      Write-Host "Copy also failed ($_); toolchain not UBT-discoverable via filesystem"
                    }
                  }
                }
              }
            }
          }

          # Step 4: Apply environment variables (PATH, INCLUDE, LIB) for this job
          Write-Host "Activating MSVC $msvcVersion environment (job-scoped)..."
          if (Test-Path $msvcKitExe) {
            $envScript = & $msvcKitExe setup --script --shell powershell --dir $msvcTargetDir
            if ($LASTEXITCODE -ne 0) { throw "msvc-kit setup failed (exit code $LASTEXITCODE)" }
            Invoke-Expression ($envScript -join "`n")
            Write-Host "MSVC $msvcVersion environment activated"
          } else {
            Write-Host "msvc-kit not found; loading VS-native environment..."
            & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          }

      - name: Patch UE 5.2 engine headers in-place for MSVC 14.44 compatibility
        if: matrix.ue_version == '5.2'
        shell: pwsh
        run: |
          $ueRoot = "$env:UE_ROOT"
          $anyPatch = $false

          # ---------- Patch 1: ConcurrentLinearAllocator.h ----------
          $allocatorRel = 'Engine\Source\Runtime\Core\Public\Experimental\ConcurrentLinearAllocator.h'
          $srcAllocator = Join-Path $ueRoot $allocatorRel

          if (Test-Path $srcAllocator) {
            $bak = "$srcAllocator.bak"
            Copy-Item $srcAllocator $bak -Force
            Set-ItemProperty -Path $srcAllocator -Name IsReadOnly -Value $false
            $srcContent = Get-Content $srcAllocator -Raw
            $orig = $srcContent
            $srcContent = $srcContent -replace '#(if|elif)\s+__has_feature\(', '#$1 defined(__has_feature) && __has_feature('
            if ($srcContent -ne $orig) {
              Set-Content $srcAllocator $srcContent -NoNewline -Encoding utf8
              Write-Host "Patched in-place: ${allocatorRel} (backup: .bak)"
              $anyPatch = $true
            } else {
              Write-Host "SKIP (no changes needed): ${allocatorRel}"
            }
          } else {
            Write-Host "SKIP (not found): ${allocatorRel}"
          }

          # ---------- Patch 2: WindowsPlatformCompilerSetup.h ----------
          $setupRel = 'Engine\Source\Runtime\Core\Public\Windows\WindowsPlatformCompilerSetup.h'
          $srcSetup = Join-Path $ueRoot $setupRel

          if (Test-Path $srcSetup) {
            $bak = "$srcSetup.bak"
            Copy-Item $srcSetup $bak -Force
            Set-ItemProperty -Path $srcSetup -Name IsReadOnly -Value $false
            $srcContent = Get-Content $srcSetup -Raw
            $orig = $srcContent
            $srcContent = $srcContent -replace '#if\s+_MSC_FULL_VER\s*>\s*\d+', '#if 0 /* patched for MSVC 14.44 compat */'
            $srcContent = $srcContent -replace '#elif\s+_MSC_FULL_VER\s*>\s*\d+', '#elif 0 /* patched for MSVC 14.44 compat */'
            if ($srcContent -ne $orig) {
              Set-Content $srcSetup $srcContent -NoNewline -Encoding utf8
              Write-Host "Patched in-place: ${setupRel} (backup: .bak)"
              $anyPatch = $true
            } else {
              Write-Host "SKIP (no changes needed): ${setupRel}"
            }
          } else {
            Write-Host "SKIP (not found): ${setupRel}"
          }

          if (-not $anyPatch) {
            Write-Host '::warning::No UE 5.2 engine headers were patched. Files may not be at expected paths.'
          }

      - name: Runner context diagnostic (UE 5.2)
        if: matrix.ue_version == '5.2'
        shell: pwsh
        run: |
          Write-Host "WhoAmI: $(whoami)"
          $isAdmin = ([Security.Principal.WindowsPrincipal]::new(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "IsAdmin: $isAdmin"

      - name: Build distributable uplugin
        shell: pwsh
        run: |
          & "$env:PYTHON_HOME\python.exe" packaging/build_distributable.py `
            --ue-root "${env:UE_ROOT}" `
            --mode "${env:DCC_MCP_UNREAL_PACKAGE_MODE}" `
            --core-wheel "${{ steps.core.outputs.wheel }}"

      - name: Upload uplugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: DccMcpUnreal-ue${{ matrix.ue_version }}-${{ matrix.artifact_suffix }}
          path: |
            dist/package/DccMcpUnreal/
            dist/DccMcpUnreal-*-ue${{ matrix.ue_version }}-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  # PR-level smoke test that validates the Python bootstrap and build flow
  # without a self-hosted Unreal Engine runner.
  verify-build-flow:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: pip install hatchling build pyyaml ruff pytest editables

      - name: Install dcc-mcp-unreal
        run: pip install -e ".[dev]"

      - name: Validate Python package and skills
        run: |
          python tools/lint_skills.py --error-only
          ruff check src tests unreal/plugin/Content/Python
          python -m pytest

      - name: Build plugin layout (without vendored deps)
        shell: pwsh
        run: python packaging/build_plugin.py --python (Get-Command python).Source --clean --zip --skip-python-deps
