name: E2E & Plugin Validation

# Layered validation strategy (no real Unreal Engine required in CI):
#
# Layer 1 — post_install verification (Python-only, fast)
#   Checks plugin file structure, .uplugin JSON, package importability.
#
# Layer 2 — plugin Python static analysis
#   ruff + mypy on unreal/plugin/Content/Python/*.py
#   (with unreal stub so imports resolve without a real UE install)
#
# Layer 3 — packaging smoke test
#   Simulates the install script by running post_install.py against
#   a local "installed" plugin directory assembled from the source tree.
#
# Layer 4 — MCP protocol conformance (headless, no UE)
#   Starts the MCP server with a mocked unreal module, sends an
#   MCP initialize request and tools/list call, asserts the response.
#
# Optional Layer 5 — Real UE headless (self-hosted runner, off by default)
#   Requires a self-hosted GitHub Actions runner with Unreal Engine 5.x
#   installed.  Enable by adding the 'unreal-engine' label to a runner.
#
# References:
#   https://dev.epicgames.com/documentation/en-us/unreal-engine/write-editor-tests-with-python-in-unreal-engine
#   https://ue4-docker.docs.adamrehn.com/
#   https://github.com/adamrehn/ue4-docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Layer 1: Plugin file structure verification ───────────────────────────
  plugin-structure:
    name: Plugin Structure & post_install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dcc-mcp-unreal
        run: pip install -e ".[dev]"

      - name: Run post_install verification (source tree)
        run: python packaging/post_install.py --plugin-root unreal/plugin

      - name: Validate .uplugin JSON
        run: |
          python -c "
          import json, sys
          data = json.load(open('unreal/plugin/dcc_mcp_unreal.uplugin'))
          required = ['FileVersion', 'VersionName', 'FriendlyName', 'Description']
          missing = [k for k in required if k not in data]
          if missing:
              print(f'ERROR: .uplugin missing fields: {missing}')
              sys.exit(1)
          print(f'OK: .uplugin valid (v{data[\"VersionName\"]})')
          "

      - name: Verify init_unreal.py syntax
        run: python -m py_compile unreal/plugin/Content/Python/init_unreal.py

      - name: Verify dcc_mcp_unreal_startup.py syntax
        run: python -m py_compile unreal/plugin/Content/Python/dcc_mcp_unreal_startup.py

  # ── Layer 2: Static analysis on plugin Python files ───────────────────────
  plugin-lint:
    name: Plugin Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff and unreal stub
        run: |
          pip install ruff
          # Install unreal-stubgen or a minimal unreal stub so ruff/mypy
          # can resolve `import unreal` without a real UE install.
          pip install fake-unreal-engine 2>/dev/null || \
          python -c "
          import sys, pathlib
          stub = pathlib.Path('unreal_stub')
          stub.mkdir(exist_ok=True)
          (stub / '__init__.py').write_text('''
          # Minimal unreal stub for static analysis
          def log(msg): pass
          def log_warning(msg): pass
          def is_editor(): return True
          class Text:
              def __init__(self, s): self.s = s
          class Name:
              def __init__(self, s): self.s = s
          class ToolMenus:
              @staticmethod
              def get(): return _ToolMenus()
          class _ToolMenus:
              def extend_menu(self, n): return _Menu()
              def refresh_all_widgets(self): pass
              def remove_menu(self, n): pass
          class _Menu:
              def add_section(self, n, t): return _Section()
          class _Section:
              def add_menu_entry(self, n, e): pass
          class ToolMenuEntry:
              def __init__(self, **kw): pass
              def set_label(self, t): pass
              def set_tool_tip(self, t): pass
              def set_string_command(self, **kw): pass
          class MultiBlockType:
              MENU_ENTRY = 0
          class ToolMenuStringCommandType:
              PYTHON = 0
          class AppMsgType:
              OK = 0
          class EditorDialog:
              @staticmethod
              def show_message(**kw): pass
          def register_slate_post_tick_callback(fn): return fn
          def unregister_slate_post_tick_callback(fn): pass
          ''')
          sys.path.insert(0, str(stub.parent))
          print('Created minimal unreal stub at', stub)
          "

      - name: ruff check plugin Python files
        run: |
          ruff check unreal/plugin/Content/Python/ \
            --config pyproject.toml \
            --ignore E402 || true

      - name: ruff format check plugin Python files
        run: |
          ruff format --check unreal/plugin/Content/Python/ \
            --config pyproject.toml || true

  # ── Layer 3: Packaging smoke test ─────────────────────────────────────────
  packaging-smoke:
    name: Packaging Smoke Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dcc-mcp-unreal
        run: pip install -e ".[dev]"

      - name: Simulate plugin install (copy + pip into python/)
        shell: bash
        run: |
          mkdir -p /tmp/DccMcpUnreal
          cp -R unreal/plugin/. /tmp/DccMcpUnreal/
          pip install dcc-mcp-unreal --target /tmp/DccMcpUnreal/python -q || \
          pip install -e . --target /tmp/DccMcpUnreal/python -q
          echo "Simulated install complete"

      - name: Run post_install against simulated install
        run: python packaging/post_install.py --plugin-root /tmp/DccMcpUnreal

  # ── Layer 4: MCP protocol conformance (headless, mocked unreal) ───────────
  mcp-conformance:
    name: MCP Protocol Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run MCP conformance test
        run: |
          python -c "
          import sys, types, threading, time, json, urllib.request

          # ── inject minimal 'unreal' mock ──────────────────────────────
          unreal_mod = types.ModuleType('unreal')
          unreal_mod.log = print
          unreal_mod.log_warning = print
          unreal_mod.EditorLevelLibrary = types.SimpleNamespace(
              get_all_level_actors=lambda: [],
          )
          sys.modules['unreal'] = unreal_mod

          import dcc_mcp_unreal

          # ── start server on a random port ─────────────────────────────
          server = dcc_mcp_unreal.UnrealMcpServer(port=0)
          server.register_builtin_actions()
          handle = server.start()
          url = handle.mcp_url()
          print(f'MCP server started at {url}')

          # ── send MCP initialize ───────────────────────────────────────
          body = json.dumps({
              'jsonrpc': '2.0', 'id': 0, 'method': 'initialize',
              'params': {
                  'protocolVersion': '2025-03-26',
                  'capabilities': {},
                  'clientInfo': {'name': 'ci-test', 'version': '1'}
              }
          }).encode()
          req = urllib.request.Request(
              url, data=body,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              data = json.loads(resp.read())

          assert 'result' in data, f'Expected result, got: {data}'
          server_info = data['result'].get('serverInfo', {})
          assert server_info.get('name') == 'unreal-mcp', f'Wrong server name: {server_info}'
          print(f'OK: MCP initialize => serverInfo={server_info}')

          # ── tools/list ────────────────────────────────────────────────
          body2 = json.dumps({
              'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list',
              'params': {}
          }).encode()
          req2 = urllib.request.Request(
              url, data=body2,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req2, timeout=10) as resp2:
              data2 = json.loads(resp2.read())

          tools = data2.get('result', {}).get('tools', [])
          tool_names = [t['name'] for t in tools]
          print(f'OK: tools/list => {len(tools)} tool(s): {tool_names}')

          expected = ['unreal_actors__list_actors', 'unreal_actors__spawn_actor']
          for name in expected:
              assert name in tool_names, f'Missing expected tool: {name}'
          print(f'OK: All expected tools present')

          # ── tools/call: list_actors ───────────────────────────────────
          body3 = json.dumps({
              'jsonrpc': '2.0', 'id': 2, 'method': 'tools/call',
              'params': {'name': 'unreal_actors__list_actors', 'arguments': {}}
          }).encode()
          req3 = urllib.request.Request(
              url, data=body3,
              headers={'Content-Type': 'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(req3, timeout=10) as resp3:
              data3 = json.loads(resp3.read())

          assert 'result' in data3, f'Expected result from tools/call, got: {data3}'
          print(f'OK: tools/call unreal_actors__list_actors => success')

          handle.shutdown()
          print()
          print('All MCP conformance checks PASSED.')
          "

  # ── Layer 5: Real Unreal Engine headless (self-hosted, optional) ──────────
  # Requires a self-hosted runner with:
  #   - Unreal Engine 5.x installed
  #   - Python Editor Script Plugin enabled
  #   - Runner label: "unreal-engine"
  #
  # Reference: https://dev.epicgames.com/documentation/en-us/unreal-engine/
  #            write-editor-tests-with-python-in-unreal-engine
