  #     - name: Run headless MCP server test
  #       run: |
  #         "$UE_ROOT/Engine/Binaries/Linux/UnrealEditor-Cmd" \
  #           "${{ github.workspace }}/tests/e2e/UETestProject/UETestProject.uproject" \
  #           -nullrhi -unattended -nopause -nosound \
