name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual build (e.g. v0.2.0). Leave empty to only run release-please."
        required: false
        default: ""
      core_version:
        description: "dcc-mcp-core release tag/version to download, for example v0.17.20"
        required: false
        default: "latest"

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── Release Please — creates/updates the release PR ────────────────────────
  release-please:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == '')
    outputs:
      release_created: ${{ steps.decide.outputs.release_created }}
      tag_name: ${{ steps.decide.outputs.tag_name }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Decide release outputs
        id: decide
        env:
          RP_CREATED: ${{ steps.release.outputs.release_created }}
          RP_TAG: ${{ steps.release.outputs.tag_name }}
          RP_VER: ${{ steps.release.outputs.version }}
        run: |
          echo "release_created=${RP_CREATED:-false}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${RP_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "version=${RP_VER:-}" >> "$GITHUB_OUTPUT"

  # ── Build wheel — only when release-please creates a release ───────────────
  build:
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Run tests
        run: |
          pip install ".[dev]"
          pytest tests/ -v --tb=short

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Build Unreal plugin packages on a self-hosted UE runner ───────────────
  build-unreal-plugin:
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    uses: ./.github/workflows/build-uplugin.yml
    with:
      core_version: ${{ github.event.inputs.core_version || 'latest' }}
    secrets: inherit

  standalone:
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, core_asset: dcc-mcp-server-linux-x86_64, server_name: dcc-mcp-server, asset_suffix: linux-X64}
          - {os: windows-latest, core_asset: dcc-mcp-server-windows-x86_64.exe, server_name: dcc-mcp-server.exe, asset_suffix: windows-X64}
          - {os: macos-latest, core_asset: dcc-mcp-server-macos-universal2, server_name: dcc-mcp-server, asset_suffix: macOS-Universal2}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pyoxidizer==0.24.0
      - name: Download native core sidecar
        env:
          GH_TOKEN: ${{ secrets.DCC_MCP_CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
          CORE_VERSION: ${{ github.event.inputs.core_version || 'latest' }}
        shell: bash
        run: |
          args=(--repo dcc-mcp/dcc-mcp-core --pattern '${{ matrix.core_asset }}' --dir core-bin)
          if [ "$CORE_VERSION" = latest ]; then
            found=false
            while read -r tag; do
              if gh release download "$tag" "${args[@]}" 2>/dev/null; then
                found=true
                echo "Using dcc-mcp-core $tag"
                break
              fi
            done < <(gh release list --repo dcc-mcp/dcc-mcp-core --limit 20 --json tagName --jq '.[].tagName')
            if [ "$found" != true ]; then
              echo "::error::No recent dcc-mcp-core release contains ${{ matrix.core_asset }}"
              exit 1
            fi
          else
            gh release download "$CORE_VERSION" "${args[@]}"
          fi
          mv 'core-bin/${{ matrix.core_asset }}' 'core-bin/${{ matrix.server_name }}'
          chmod +x 'core-bin/${{ matrix.server_name }}' || true
      - name: Build standalone sidecar
        run: python tools/build_binary.py --server "core-bin/${{ matrix.server_name }}"
      - name: Archive standalone
        shell: bash
        run: |
          tag='${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}'
          base="dcc-mcp-unreal-${tag}-${{ matrix.asset_suffix }}"
          if [ '${{ runner.os }}' = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/standalone/*' -DestinationPath '${base}.zip'"
            echo "ASSET=${base}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${base}.tar.gz" -C dist/standalone .
            echo "ASSET=${base}.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET }}

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  publish:
    needs: [release-please, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-unreal
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: List dist
        run: ls -la dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  # ── Attach wheels to GitHub Release ─────────────────────────────────────────
  attach-release-assets:
    needs: [release-please, publish, build-unreal-plugin, standalone]
    if: |
      always() &&
      (
        needs.publish.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.tag_name != '' &&
          needs.publish.result == 'skipped'
        )
      ) &&
      needs.build-unreal-plugin.result == 'success' &&
      needs.standalone.result == 'success' &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Download Unreal plugin package
        uses: actions/download-artifact@v4
        with:
          pattern: DccMcpUnreal-*
          path: unreal-plugin/
          merge-multiple: true

      - name: Download standalone sidecars
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: standalone/
          merge-multiple: true

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*
            unreal-plugin/*.zip
            standalone/*
            scripts/install-standalone.ps1
