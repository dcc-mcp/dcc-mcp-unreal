name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual build (e.g. v0.2.0). Leave empty to only run release-please."
        required: false
        default: ""
      core_version:
        description: "dcc-mcp-core release tag/version to download, for example v0.17.20"
        required: false
        default: "latest"

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── Release Please — creates/updates the release PR ────────────────────────
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      release_created: ${{ steps.decide.outputs.release_created }}
      tag_name: ${{ steps.decide.outputs.tag_name }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Decide release outputs
        id: decide
        env:
          RP_CREATED: ${{ steps.release.outputs.release_created }}
          RP_TAG: ${{ steps.release.outputs.tag_name }}
          RP_VER: ${{ steps.release.outputs.version }}
        run: |
          echo "release_created=${RP_CREATED:-false}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${RP_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "version=${RP_VER:-}" >> "$GITHUB_OUTPUT"

  # ── Build wheel — only when release-please creates a release ───────────────
  build:
    needs: [release-please]
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
      github.event_name == 'push' ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Run tests
        run: |
          pip install ".[dev]"
          pytest tests/ -v --tb=short

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Build Unreal plugin packages on a self-hosted UE runner ───────────────
  build-unreal-plugin:
    needs: [release-please]
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
      github.event_name == 'push' ||
      github.event_name == 'release'
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - ue_version: "5.7"
            ue_root: C:\Program Files\Epic Games\UE_5.7
            package_mode: native
            artifact_suffix: win64
          - ue_version: "5.2"
            ue_root: C:\Program Files\Epic Games\UE_5.2
            package_mode: native
            artifact_suffix: win64
          - ue_version: "4.18"
            ue_root: C:\Program Files\Epic Games\UE_4.18
            package_mode: python-only
            artifact_suffix: python-only
    env:
      CORE_REPO: loonghao/dcc-mcp-core
      CORE_VERSION: ${{ github.event.inputs.core_version || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build pyyaml ruff pytest

      - name: Validate Python package and skills
        shell: pwsh
        run: |
          python tools/lint_skills.py --error-only
          python -m ruff check src tests unreal/plugin/Content/Python
          python -m pytest

      - name: Download dcc-mcp-core wheel from release
        id: core
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DCC_MCP_CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path dist/core-wheel | Out-Null
          $tag = "${env:CORE_VERSION}"
          if ($tag -eq "" -or $tag -eq "latest") {
            gh release download --repo "${env:CORE_REPO}" --pattern "dcc_mcp_core_semantic-*-cp38-abi3-win_amd64.whl" --dir dist/core-wheel --clobber
          } else {
            gh release download $tag --repo "${env:CORE_REPO}" --pattern "dcc_mcp_core_semantic-*-cp38-abi3-win_amd64.whl" --dir dist/core-wheel --clobber
          }
          $wheel = Get-ChildItem dist/core-wheel -Filter "dcc_mcp_core_semantic-*-cp38-abi3-win_amd64.whl" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $wheel) { throw "dcc-mcp-core wheel was not downloaded" }
          "wheel=$($wheel.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "Using core wheel: $($wheel.FullName)"

      - name: Build distributable uplugin
        shell: pwsh
        env:
          UE_ROOT: ${{ matrix.ue_root }}
          DCC_MCP_UNREAL_PACKAGE_MODE: ${{ matrix.package_mode }}
        run: |
          python packaging/build_distributable.py `
            --ue-root "${env:UE_ROOT}" `
            --mode "${env:DCC_MCP_UNREAL_PACKAGE_MODE}" `
            --core-wheel "${{ steps.core.outputs.wheel }}"

      - name: Upload Unreal plugin package
        uses: actions/upload-artifact@v4
        with:
          name: unreal-plugin-ue${{ matrix.ue_version }}-${{ matrix.artifact_suffix }}
          path: dist/DccMcpUnreal-*-ue${{ matrix.ue_version }}-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  publish:
    needs: [release-please, build]
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-unreal
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: List dist
        run: ls -la dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true

  # ── Attach wheels to GitHub Release ─────────────────────────────────────────
  attach-release-assets:
    needs: [release-please, publish, build-unreal-plugin]
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Download Unreal plugin package
        uses: actions/download-artifact@v4
        with:
          pattern: unreal-plugin-*
          path: unreal-plugin/
          merge-multiple: true

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.ref_name }}
          files: |
            dist/*
            unreal-plugin/*.zip
