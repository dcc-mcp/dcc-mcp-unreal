name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for manual build (e.g. v0.2.0). Leave empty to only run release-please."
        required: false
        default: ""
      core_version:
        description: "dcc-mcp-core release tag/version to download, for example v0.17.20"
        required: false
        default: "latest"

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── Release Please — creates/updates the release PR ────────────────────────
  release-please:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == '')
    outputs:
      release_created: ${{ steps.decide.outputs.release_created }}
      tag_name: ${{ steps.decide.outputs.tag_name }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Decide release outputs
        id: decide
        env:
          RP_CREATED: ${{ steps.release.outputs.release_created }}
          RP_TAG: ${{ steps.release.outputs.tag_name }}
          RP_VER: ${{ steps.release.outputs.version }}
        run: |
          echo "release_created=${RP_CREATED:-false}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${RP_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "version=${RP_VER:-}" >> "$GITHUB_OUTPUT"

  # ── Build wheel — only when release-please creates a release ───────────────
  build:
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ -v --tb=short

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ── Build Unreal plugin packages on a self-hosted UE runner ───────────────
  build-unreal-plugin:
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    uses: ./.github/workflows/build-uplugin.yml
    with:
      core_version: ${{ github.event.inputs.core_version || 'latest' }}
    secrets: inherit

  standalone:
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, core_asset: dcc-mcp-server-linux-x86_64, server_name: dcc-mcp-server, asset_suffix: linux-X64}
          - {os: windows-latest, core_asset: dcc-mcp-server-windows-x86_64.exe, server_name: dcc-mcp-server.exe, asset_suffix: windows-X64}
          - {os: macos-latest, core_asset: dcc-mcp-server-macos-universal2, server_name: dcc-mcp-server, asset_suffix: macOS-Universal2}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pyoxidizer==0.24.0
      - name: Download native core sidecar
        env:
          GH_TOKEN: ${{ secrets.DCC_MCP_CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
          CORE_VERSION: ${{ github.event.inputs.core_version || 'latest' }}
          CORE_ASSET: ${{ matrix.core_asset }}
          SERVER_NAME: ${{ matrix.server_name }}
        shell: bash
        run: |
          args=(--repo dcc-mcp/dcc-mcp-core --pattern "$CORE_ASSET" --dir core-bin)
          if [ "$CORE_VERSION" = latest ]; then
            found=false
            while read -r tag; do
              if gh release download "$tag" "${args[@]}" 2>/dev/null; then
                found=true
                echo "Using dcc-mcp-core $tag"
                break
              fi
            done < <(gh release list --repo dcc-mcp/dcc-mcp-core --limit 20 --json tagName --jq '.[].tagName')
            if [ "$found" != true ]; then
              echo "::error::No recent dcc-mcp-core release contains $CORE_ASSET"
              exit 1
            fi
          else
            gh release download "$CORE_VERSION" "${args[@]}"
          fi
          mv "core-bin/$CORE_ASSET" "core-bin/$SERVER_NAME"
          chmod +x "core-bin/$SERVER_NAME" || true
      - name: Build standalone sidecar
        env:
          SERVER_NAME: ${{ matrix.server_name }}
        shell: bash
        run: python tools/build_binary.py --server "core-bin/$SERVER_NAME"
      - name: Archive standalone
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RUNNER_OS_NAME: ${{ runner.os }}
        shell: bash
        run: |
          # RELEASE_TAG feeds the archive name and, through ASSET, the
          # upload-artifact `path:`. That path is a newline-separated glob list, and
          # the delimiter write below deliberately keeps newlines inside the value, so
          # a tag containing one would upload whatever the extra lines match instead of
          # the archive. Reject anything outside a safe filename charset first: a bad
          # tag must fail loudly, not silently pick different files. `%q` keeps the
          # echoed value on one line so it cannot forge a workflow command.
          case "$RELEASE_TAG" in
            "")
              echo "::error::RELEASE_TAG is empty"
              exit 1
              ;;
            *[!A-Za-z0-9._+-]*)
              echo "::error::RELEASE_TAG may only contain [A-Za-z0-9._+-]"
              printf '  got: %q\n' "$RELEASE_TAG"
              exit 1
              ;;
          esac
          base="dcc-mcp-unreal-${RELEASE_TAG}-${ASSET_SUFFIX}"
          if [ "$RUNNER_OS_NAME" = Windows ]; then
            ARCHIVE_PATH="${base}.zip" powershell -NoProfile -Command 'Compress-Archive -Path "dist/standalone/*" -DestinationPath $env:ARCHIVE_PATH'
            asset="${base}.zip"
          else
            tar -czf "${base}.tar.gz" -C dist/standalone .
            asset="${base}.tar.gz"
          fi
          # Write ASSET with the GITHUB_ENV delimiter form: the `NAME<<DELIMITER`
          # marker has to reach the env file itself, so a value containing a newline
          # stays inside the value instead of becoming extra entries. A shell heredoc
          # does not do that -- it bounds the shell command, not the env-file record.
          # The delimiter is randomised so a crafted value cannot close it early.
          delimiter="ASSET_EOF_$$_${RANDOM}${RANDOM}"
          echo "ASSET<<$delimiter" >> "$GITHUB_ENV"
          printf '%s\n' "$asset" >> "$GITHUB_ENV"
          echo "$delimiter" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET }}

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  publish:
    needs: [release-please, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-unreal
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: List dist
        run: ls -la dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true

  # ── Attach wheels to GitHub Release ─────────────────────────────────────────
  attach-release-assets:
    needs: [release-please, publish, build-unreal-plugin, standalone]
    if: |
      always() &&
      (
        needs.publish.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.tag_name != '' &&
          needs.publish.result == 'skipped'
        )
      ) &&
      needs.build-unreal-plugin.result == 'success' &&
      needs.standalone.result == 'success' &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Download Unreal plugin package
        uses: actions/download-artifact@v4
        with:
          pattern: DccMcpUnreal-*
          path: unreal-plugin/
          merge-multiple: true

      - name: Download standalone sidecars
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: standalone/
          merge-multiple: true

      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*
            unreal-plugin/*.zip
            standalone/*
            scripts/install-standalone.ps1

  # ── Fail-visible summary — a half-published release must not look green ───
  #
  # `publish` deliberately does NOT depend on `build-unreal-plugin`: the PyPI
  # upload must not be held hostage by the availability of the self-hosted
  # Unreal runner. The cost of that asymmetry is that `attach-release-assets`
  # can be *skipped* while the tag is already public and PyPI already updated.
  # A skip is not a failure to GitHub, so the run used to end green with a
  # GitHub Release that carries no assets at all.
  #
  # This job is the closing bracket. It always runs, treats a skipped or failed
  # producer — or a skipped attach step — as fatal, and names the assets that
  # are therefore missing. `build-unreal-plugin` is intentionally still not a
  # required status check, so this is the only place the signal is enforced.
  release-summary:
    name: Release summary (fail visible)
    needs:
      [release-please, build, build-unreal-plugin, standalone, publish, attach-release-assets]
    if: |
      always() && !cancelled() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event_name == 'release'
      )
    runs-on: ubuntu-latest
    env:
      # Every job result reaches the script through `env:`, never through
      # `${{ }}` interpolation: an Actions expression is expanded before the
      # shell parses the script, which would turn workflow data into shell
      # source. `needs.<job>.result` is empty for a job that never ran, which is
      # exactly the silent case this job exists to catch.
      RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}
      RESULT_ATTACH_RELEASE_ASSETS: ${{ needs.attach-release-assets.result }}
      RESULT_BUILD: ${{ needs.build.result }}
      RESULT_BUILD_UNREAL_PLUGIN: ${{ needs.build-unreal-plugin.result }}
      RESULT_PUBLISH: ${{ needs.publish.result }}
      RESULT_RELEASE_PLEASE: ${{ needs.release-please.result }}
      RESULT_STANDALONE: ${{ needs.standalone.result }}
    steps:
      - name: Fail the run when a release asset was never produced or attached
        run: |
          set -u

          missing=0

          fail() {
            printf '::error::%s\n' "$1"
            missing=1
          }

          # require_success <job> <result> [asset ...] — report the job and the
          # assets only it produces when it did not succeed.
          require_success() {
            job="$1"
            result="$2"
            shift 2
            if [ "$result" != success ]; then
              fail "release job $job did not succeed (result: ${result:-empty})"
              printf '  assets only %s produces, now missing:\n' "$job"
              for asset in "$@"; do
                printf '    - %s\n' "$asset"
              done
            fi
          }

          echo 'Release job results:'
          printf '  %-22s %s\n' release-please "$RESULT_RELEASE_PLEASE"
          printf '  %-22s %s\n' build "$RESULT_BUILD"
          printf '  %-22s %s\n' build-unreal-plugin "$RESULT_BUILD_UNREAL_PLUGIN"
          printf '  %-22s %s\n' standalone "$RESULT_STANDALONE"
          printf '  %-22s %s\n' publish "$RESULT_PUBLISH"
          printf '  %-22s %s\n' attach-release-assets "$RESULT_ATTACH_RELEASE_ASSETS"

          # release-please is legitimately skipped for a tag push, a published
          # Release event, or a manual dispatch with an explicit tag, so only a
          # real failure is fatal here.
          case "$RESULT_RELEASE_PLEASE" in
            success | skipped) ;;
            *)
              fail "release job release-please did not succeed (result: ${RESULT_RELEASE_PLEASE:-empty})"
              printf '  missing: the GitHub Release object and its tag\n'
              ;;
          esac

          require_success build "$RESULT_BUILD" \
            'dist/*.whl (Python wheel)' \
            'dist/*.tar.gz (Python sdist)'

          require_success build-unreal-plugin "$RESULT_BUILD_UNREAL_PLUGIN" \
            'DccMcpUnreal-*-ue5.5-win64.zip' \
            'DccMcpUnreal-*-ue5.7-win64.zip' \
            'DccMcpUnreal-*-ue5.8-win64.zip' \
            'DccMcpUnreal-*-ue4.18-win64.zip' \
            'DccMcpUnreal-*-ue4.26-win64.zip'

          require_success standalone "$RESULT_STANDALONE" \
            'dcc-mcp-unreal-<tag>-linux-X64.tar.gz' \
            'dcc-mcp-unreal-<tag>-windows-X64.zip' \
            'dcc-mcp-unreal-<tag>-macOS-Universal2.tar.gz'

          # attach-release-assets is the only job that uploads the artifacts to
          # the GitHub Release: when it does not run the tag is public and empty
          # even if every producer succeeded.
          require_success attach-release-assets "$RESULT_ATTACH_RELEASE_ASSETS" \
            'dist/* (wheel + sdist)' \
            'unreal-plugin/*.zip (5 Unreal plugin packages)' \
            'standalone/* (3 standalone sidecar archives)' \
            'scripts/install-standalone.ps1'

          # PyPI is published only when release-please cut the tag; on a manual
          # dispatch with an explicit tag `publish` is skipped by design.
          if [ "$RELEASE_CREATED" = true ]; then
            require_success publish "$RESULT_PUBLISH" 'dcc-mcp-unreal on PyPI (Trusted Publishing)'
          else
            case "$RESULT_PUBLISH" in
              success | skipped) ;;
              *) fail "release job publish did not succeed (result: ${RESULT_PUBLISH:-empty})" ;;
            esac
          fi

          if [ "$missing" -ne 0 ]; then
            printf '\nRelease %s is incomplete: the assets listed above were never attached.\n' "$RELEASE_TAG"
            printf 'Fix the failing job and re-run the workflow; until then the tag is public with missing assets.\n'
            printf 'For build-unreal-plugin: check the self-hosted Unreal runner and the 5 build-uplugin lanes.\n'
            exit 1
          fi

          printf '\nRelease %s is complete: every expected asset was produced and attached.\n' "$RELEASE_TAG"
