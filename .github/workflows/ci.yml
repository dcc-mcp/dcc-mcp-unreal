name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        # Supported runtime matrix: Python 3.9+
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  lint-skills:
    name: Lint Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Lint SKILL.md files
        run: python tools/lint_skills.py --error-only

  install-sop-smoke:
    name: Install SOP lifecycle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run lifecycle and bootstrap contract tests
        run: python -m pytest tests/test_install_cli.py tests/test_unreal_install_identity.py tests/test_bootstrap_diagnostics.py -q

      - name: Build and inspect wheel lifecycle payload
        run: |
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("dcc_mcp_unreal-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "dcc_mcp_unreal/install_cli.py",
              "dcc_mcp_unreal/_plugin/DccMcpUnreal.uplugin",
              "dcc_mcp_unreal/_plugin/Content/Python/init_unreal.py",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing lifecycle payload: {sorted(missing)}")
          PY

  package-unreal-plugin:
    name: Package Unreal Plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build plugin layout without vendored deps
        shell: pwsh
        run: |
          python packaging/build_plugin.py --python (Get-Command python).Source --clean --zip --skip-python-deps

      - name: Verify plugin descriptor
        shell: pwsh
        run: |
          if (!(Test-Path dist/DccMcpUnreal/DccMcpUnreal.uplugin)) { throw "Missing DccMcpUnreal.uplugin" }
          if (!(Test-Path dist/DccMcpUnreal/Content/Python/init_unreal.py)) { throw "Missing init_unreal.py" }
          if (!(Get-ChildItem dist -Filter 'DccMcpUnreal-*.zip')) { throw "Missing plugin zip" }
