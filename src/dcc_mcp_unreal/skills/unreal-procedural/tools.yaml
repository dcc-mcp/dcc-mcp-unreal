tools:
  - name: inspect_procedural_capabilities
    description: Read-only probe of Unreal procedural feature plugins, reflected classes, engine version and capability status.
    source_file: scripts/inspect_procedural_capabilities.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      additionalProperties: false
    next-tools:
      on-success: [unreal_procedural__validate_procedural_workflow]

  - name: validate_procedural_workflow
    description: Validate an explicit, bounded request for PCG manual overrides, Procedural Vegetation, Nanite Foliage, Mesh Terrain, MegaLights or Substrate without mutating the Unreal host.
    source_file: scripts/validate_procedural_workflow.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [feature, operation, request]
      additionalProperties: false
      properties:
        feature:
          type: string
          enum: [pcg_manual_overrides, procedural_vegetation, nanite_foliage, mesh_terrain, megalights, substrate]
        operation:
          type: string
          minLength: 1
        request:
          type: object
          additionalProperties: true
    next-tools:
      on-success: [unreal_procedural__inspect_procedural_capabilities]

