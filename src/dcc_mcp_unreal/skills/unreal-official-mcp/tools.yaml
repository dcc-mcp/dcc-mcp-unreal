tools:
  - name: prepare_official_mcp
    description: Enable Epic Unreal MCP, selected official toolsets, or the UE 5.9 Unreal Canvas Bridge for the current project.
    source_file: scripts/prepare_official_mcp.py
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    read_only: false
    destructive: true
    idempotent: true
    input_schema:
      type: object
      properties:
        server_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8000
          description: Explicit official MCP port to configure. No automatic selection or fallback. File readback is not live listener verification; use the returned configured_endpoint with the bridge after independent ownership and loopback checks.
        include_editor_toolset:
          type: boolean
          default: true
        include_niagara_toolsets:
          type: boolean
          default: false
        include_pcg_toolset:
          type: boolean
          default: false
          description: Opt in to installed PCGToolset after validating its descriptor and required dependencies. Does not start the server or verify loaded tools.
        include_all_toolsets:
          type: boolean
          default: false
          description: Enable the UE 5.9 All Toolsets plugin so the native MCP can expose its complete installed toolset catalog.
        include_canvas_bridge:
          type: boolean
          default: false
          description: Enable the UE 5.9 Unreal Canvas Bridge and its native Canvas integration when installed.
        include_spatial_annotations:
          type: boolean
          default: false
          description: Enable the UE 5.9 Unreal Canvas Spatial Annotations plugin when installed.
    output_schema:
      type: object
      additionalProperties: true
    call_examples:
      - arguments: {}
        note: Enable the official MCP server and general editor tools.
      - arguments:
          include_niagara_toolsets: true
        note: Also enable official Niagara tools for a Niagara authoring task.
      - arguments:
          include_pcg_toolset: true
        note: Also enable installed official PCG tools; fails without writes if a required dependency is missing, invalid, or explicitly disabled.
      - arguments:
          include_all_toolsets: true
          include_canvas_bridge: true
          include_spatial_annotations: true
        note: Prepare the UE 5.9 native MCP and Canvas integration together.
      - arguments:
          server_port: 18081
        note: Configure an explicitly selected port for an authorized isolated project; this does not check availability or start a server.
  - name: official_mcp_bridge
    description: Discover or call Epic Unreal MCP tools through its local Streamable HTTP endpoint.
    source_file: scripts/official_mcp_bridge.py
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum: [status, list_tools, list_toolsets, describe_toolset, describe_tools, list_resources, read_resource, call_tool]
        endpoint:
          type: string
          default: http://127.0.0.1:8000/mcp
        toolset_name:
          type: string
        tool_name:
          type: string
        tool_names:
          type: array
          items:
            type: string
          description: Complete official tool names for the UE 5.9 describe_tools discovery operation.
        resource_uri:
          type: string
          description: URI passed to the official MCP resources/read operation.
        arguments:
          type: object
        timeout:
          type: number
          minimum: 1
          default: 15
          description: Overall HTTP operation timeout in seconds; raise for large PCG graphs or Data View calls.
    output_schema:
      type: object
      additionalProperties: true
    call_examples:
      - arguments:
          operation: status
        note: Confirm that Epic Unreal MCP is running before discovery.
      - arguments:
          operation: status
          endpoint: http://127.0.0.1:18081/mcp
        note: Use the exact configured_endpoint after verifying the intended instance and actual loopback listener; this URL does not change the listener's port or bind address.
      - arguments:
          operation: describe_toolset
          toolset_name: ActorTools
        note: Inspect the official schema before a call.
