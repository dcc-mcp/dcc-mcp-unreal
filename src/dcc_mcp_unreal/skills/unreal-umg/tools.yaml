tools:
  - name: create_widget_blueprint
    description: >-
      Create a new UMG Widget Blueprint asset inheriting from UserWidget.
      The asset is created under /Game/ namespace. Optionally specify a
      parent class for inheritance.
    input_schema:
      type: object
      required: [asset_path, widget_name]
      properties:
        asset_path:
          type: string
          description: "Asset path under /Game/ namespace (e.g. /Game/UI/). Must start with /Game/."
        widget_name:
          type: string
          description: "Name for the new Widget Blueprint asset. Must be a valid Unreal asset name."
        parent_class:
          type: string
          description: "Optional parent class path. Defaults to UserWidget if omitted."
          default: "/Script/UMG.UserWidget"
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      destructive_hint: true
    source_file: scripts/create_widget_blueprint.py
    next-tools:
      on-success:
        - unreal_umg__add_widget_to_canvas
        - unreal_umg__compile_widget_blueprint
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          asset_path: "/Game/UI/"
          widget_name: "WBP_MainMenu"
        note: "Create a main menu widget blueprint"
      - arguments:
          asset_path: "/Game/UI/HUD/"
          widget_name: "WBP_PlayerHUD"
          parent_class: "/Script/UMG.UserWidget"
        note: "Create a HUD widget with explicit parent class"

  - name: add_widget_to_canvas
    description: >-
      Add a child widget to a CanvasPanel or other panel container.
      Supports Button, TextBlock, Image, CanvasPanel, VerticalBox,
      HorizontalBox, Overlay, Border, SizeBox, EditableText, ProgressBar,
      and Slider widget types. The widget type is validated against a
      whitelist.
    input_schema:
      type: object
      required: [widget_blueprint_path, parent_widget_name, child_widget_type, child_widget_name]
      properties:
        widget_blueprint_path:
          type: string
          description: "Asset path of the Widget Blueprint to modify (e.g. /Game/UI/WBP_MainMenu)."
        parent_widget_name:
          type: string
          description: "Name of the parent panel widget to add the child to."
        child_widget_type:
          type: string
          description: "Type of widget to create. Must be one of the whitelisted types."
          enum: [Button, TextBlock, Image, CanvasPanel, VerticalBox, HorizontalBox, Overlay, Border, SizeBox, EditableText, ProgressBar, Slider]
        child_widget_name:
          type: string
          description: "Unique name for the new child widget."
        slot_position:
          type: object
          description: "Optional slot position (x, y) for CanvasPanelSlot. Only used when parent is CanvasPanel."
          properties:
            x:
              type: number
              description: "Horizontal position in canvas units."
              default: 0.0
            y:
              type: number
              description: "Vertical position in canvas units."
              default: 0.0
        slot_size:
          type: object
          description: "Optional slot size (x, y) for CanvasPanelSlot. Only used when parent is CanvasPanel."
          properties:
            x:
              type: number
              description: "Width in canvas units."
              default: 200.0
            y:
              type: number
              description: "Height in canvas units."
              default: 50.0
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      destructive_hint: true
    source_file: scripts/add_widget_to_canvas.py
    next-tools:
      on-success:
        - unreal_umg__set_widget_properties
        - unreal_umg__bind_widget_event
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          parent_widget_name: "CanvasPanel_0"
          child_widget_type: "Button"
          child_widget_name: "Btn_Start"
          slot_position: {x: 100.0, y: 200.0}
          slot_size: {x: 200.0, y: 60.0}
        note: "Add a Start button to the main menu canvas"
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          parent_widget_name: "CanvasPanel_0"
          child_widget_type: "TextBlock"
          child_widget_name: "Txt_Title"
          slot_position: {x: 50.0, y: 10.0}
        note: "Add a title text to the canvas"

  - name: set_widget_properties
    description: >-
      Set display properties on an existing widget: size, anchors,
      visibility, tooltip, and style overrides. Supports the full set of
      UMG widget property categories.
    input_schema:
      type: object
      required: [widget_blueprint_path, widget_name]
      properties:
        widget_blueprint_path:
          type: string
          description: "Asset path of the Widget Blueprint containing the widget."
        widget_name:
          type: string
          description: "Name of the widget to modify."
        size:
          type: object
          description: "Widget size override (width, height)."
          properties:
            x:
              type: number
              description: "Width in slate units."
            y:
              type: number
              description: "Height in slate units."
        anchors:
          type: object
          description: "Anchor preset or explicit anchor values."
          properties:
            preset:
              type: string
              description: "Anchor preset name."
              enum: [top-left, top-center, top-right, center-left, center-center, center-right, bottom-left, bottom-center, bottom-right, stretch, stretch-top, stretch-middle, stretch-bottom]
            minimum_x:
              type: number
              description: "Minimum anchor X (0.0-1.0). Used when preset is omitted."
            minimum_y:
              type: number
              description: "Minimum anchor Y (0.0-1.0). Used when preset is omitted."
            maximum_x:
              type: number
              description: "Maximum anchor X (0.0-1.0). Used when preset is omitted."
            maximum_y:
              type: number
              description: "Maximum anchor Y (0.0-1.0). Used when preset is omitted."
        visibility:
          type: string
          description: "Widget visibility mode."
          enum: [Visible, Collapsed, Hidden, HitTestInvisible, SelfHitTestInvisible]
        tooltip:
          type: string
          description: "Tooltip text to display on hover."
        is_enabled:
          type: boolean
          description: "Whether the widget is interactive."
        render_opacity:
          type: number
          description: "Render opacity (0.0 to 1.0)."
          minimum: 0.0
          maximum: 1.0
        z_order:
          type: integer
          description: "Z-order for rendering priority."
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      destructive_hint: true
    source_file: scripts/set_widget_properties.py
    next-tools:
      on-success:
        - unreal_umg__bind_widget_event
        - unreal_umg__create_umg_animation
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          widget_name: "Btn_Start"
          size: {x: 300.0, y: 80.0}
          visibility: "Visible"
          is_enabled: true
        note: "Resize and enable the Start button"
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          widget_name: "Txt_Title"
          anchors:
            preset: "top-center"
          render_opacity: 0.9
        note: "Anchor title to top-center with slight transparency"

  - name: bind_widget_event
    description: >-
      Bind a widget interaction event to a Blueprint-implemented function.
      Supports common UMG events: OnClicked, OnPressed, OnReleased,
      OnHovered, OnUnhovered, OnDragDetected, and OnDragCancelled.
      The event name is validated against a whitelist.
    input_schema:
      type: object
      required: [widget_blueprint_path, widget_name, event_name, function_name]
      properties:
        widget_blueprint_path:
          type: string
          description: "Asset path of the Widget Blueprint containing the widget."
        widget_name:
          type: string
          description: "Name of the widget to bind the event to."
        event_name:
          type: string
          description: "Name of the UMG event to bind."
          enum: [OnClicked, OnPressed, OnReleased, OnHovered, OnUnhovered, OnDragDetected, OnDragCancelled]
        function_name:
          type: string
          description: "Name of the Blueprint function to bind. Will be created if it does not exist."
        create_function:
          type: boolean
          description: "Whether to auto-create the Blueprint function if it does not exist."
          default: true
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      destructive_hint: true
    source_file: scripts/bind_widget_event.py
    next-tools:
      on-success:
        - unreal_umg__compile_widget_blueprint
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          widget_name: "Btn_Start"
          event_name: "OnClicked"
          function_name: "OnStartClicked"
        note: "Bind the Start button click event"
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          widget_name: "Btn_Start"
          event_name: "OnHovered"
          function_name: "OnStartHovered"
        note: "Bind hover enter event to Start button"

  - name: create_umg_animation
    description: >-
      Create a new UMG WidgetAnimation track on a widget within a Widget
      Blueprint. The animation is stored as a named timeline that can
      receive keyframes for position, opacity, color, scale, rotation,
      visibility, or shear properties.
    input_schema:
      type: object
      required: [widget_blueprint_path, animation_name, target_widget_name]
      properties:
        widget_blueprint_path:
          type: string
          description: "Asset path of the Widget Blueprint to add the animation to."
        animation_name:
          type: string
          description: "Unique name for the new WidgetAnimation."
        target_widget_name:
          type: string
          description: "Name of the widget to animate."
        duration:
          type: number
          description: "Animation duration in seconds."
          default: 1.0
        loop:
          type: boolean
          description: "Whether the animation loops."
          default: false
        num_loops_to_play:
          type: integer
          description: "Number of loops (-1 for infinite, only when loop is true)."
          default: 1
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      destructive_hint: true
    source_file: scripts/create_umg_animation.py
    next-tools:
      on-success:
        - unreal_umg__add_animation_keyframe
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          animation_name: "Anim_FadeIn"
          target_widget_name: "Txt_Title"
          duration: 0.5
        note: "Create a fade-in animation for the title"
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          animation_name: "Anim_ButtonPulse"
          target_widget_name: "Btn_Start"
          duration: 2.0
          loop: true
          num_loops_to_play: -1
        note: "Create a looping pulse animation for Start button"

  - name: add_animation_keyframe
    description: >-
      Add a keyframe to an existing UMG WidgetAnimation track.
      Supports keying position (RenderTransform.Translation), opacity
      (RenderOpacity), color (ColorAndOpacity), scale
      (RenderTransform.Scale), rotation (RenderTransform.Angle),
      visibility, and shear (RenderTransform.Shear).
    input_schema:
      type: object
      required: [widget_blueprint_path, animation_name, time]
      properties:
        widget_blueprint_path:
          type: string
          description: "Asset path of the Widget Blueprint containing the animation."
        animation_name:
          type: string
          description: "Name of the WidgetAnimation to add the keyframe to."
        time:
          type: number
          description: "Time in seconds for this keyframe."
        property:
          type: string
          description: "The animated property to key."
          enum: [position, opacity, color, scale, rotation, visibility, shear]
        value:
          description: "Keyframe value — type depends on the property."
          oneOf:
            - type: object
              description: "Position or scale as {x, y}."
              properties:
                x: {type: number}
                y: {type: number}
            - type: number
              description: "Opacity as a float 0.0-1.0, or rotation as degrees."
            - type: object
              description: "Color as {r, g, b, a} with values 0.0-1.0."
              properties:
                r: {type: number}
                g: {type: number}
                b: {type: number}
                a: {type: number}
            - type: boolean
              description: "Visibility as true/false."
            - type: object
              description: "Shear as {x, y}."
              properties:
                x: {type: number}
                y: {type: number}
        interpolation:
          type: string
          description: "Interpolation mode for this keyframe."
          enum: [Linear, Cubic, Constant]
          default: "Linear"
    read_only: false
    destructive: false
    idempotent: false
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      destructive_hint: true
    source_file: scripts/add_animation_keyframe.py
    next-tools:
      on-success:
        - unreal_umg__compile_widget_blueprint
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          animation_name: "Anim_FadeIn"
          time: 0.0
          property: "opacity"
          value: 0.0
        note: "Key opacity to 0 at time 0"
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          animation_name: "Anim_FadeIn"
          time: 0.5
          property: "opacity"
          value: 1.0
        note: "Key opacity to 1 at time 0.5 — fade in complete"

  - name: compile_widget_blueprint
    description: >-
      Compile a Widget Blueprint and return any compilation errors or
      warnings. Use this after making a batch of widget changes to
      validate the blueprint state.
    input_schema:
      type: object
      required: [widget_blueprint_path]
      properties:
        widget_blueprint_path:
          type: string
          description: "Asset path of the Widget Blueprint to compile."
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
    source_file: scripts/compile_widget_blueprint.py
    next-tools:
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
        note: "Compile the main menu widget blueprint"

  - name: list_widget_hierarchy
    description: >-
      Read the full widget tree hierarchy from a Widget Blueprint,
      returning the widget type, name, parent, and children for each
      widget in the tree.
    input_schema:
      type: object
      required: [widget_blueprint_path]
      properties:
        widget_blueprint_path:
          type: string
          description: "Asset path of the Widget Blueprint to inspect."
        root_widget_name:
          type: string
          description: "Optional root widget name. Defaults to the blueprint's root widget."
        max_depth:
          type: integer
          description: "Maximum depth to traverse. Defaults to 10."
          default: 10
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
    source_file: scripts/list_widget_hierarchy.py
    next-tools:
      on-failure:
        - dcc_diagnostics__screenshot
        - dcc_diagnostics__audit_log
    compatibility:
      unreal_min: "5.4"
    call_examples:
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
        note: "List full widget hierarchy of the main menu"
      - arguments:
          widget_blueprint_path: "/Game/UI/WBP_MainMenu"
          root_widget_name: "CanvasPanel_0"
          max_depth: 3
        note: "Inspect the top 3 levels under CanvasPanel_0"
