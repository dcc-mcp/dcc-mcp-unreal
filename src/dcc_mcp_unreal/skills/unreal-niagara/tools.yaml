tools:
  - name: author_niagara_system
    description: >-
      Create and finalize a Niagara system through UE 5.8's public external
      editor API. Adds emitters, module scripts, typed module inputs, and
      renderers in one verified operation. Commandlets and hosts without a
      fully loaded Slate editor fail closed without creating an asset.
    source_file: scripts/author_niagara_system.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      additionalProperties: false
      required: [system_name, emitters]
      properties:
        system_name:
          type: string
          minLength: 1
          description: Name for the Niagara system asset.
        package_path:
          type: string
          default: /Game/VFX
          pattern: ^/Game(?:/.*)?$
          description: Content Browser folder for the new system.
        emitters:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [name, modules, renderers]
            properties:
              name:
                type: string
                minLength: 1
              template_path:
                type: string
                default: /Niagara/DefaultAssets/Templates/CascadeConversion/CompletelyEmpty.CompletelyEmpty
                description: Optional Niagara emitter template; defaults to Epic's completely empty emitter.
              modules:
                type: array
                maxItems: 256
                items:
                  type: object
                  additionalProperties: false
                  required: [name, script, asset_path]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: Stable semantic label returned in diagnostics.
                    script:
                      type: string
                      enum: [emitter_spawn, emitter_update, particle_spawn, particle_update]
                    asset_path:
                      type: string
                      minLength: 1
                      description: Object path to a Niagara module script asset.
                    inputs:
                      type: object
                      default: {}
                      maxProperties: 128
                      additionalProperties:
                        type: object
                        additionalProperties: false
                        required: [type, value]
                        properties:
                          type:
                            type: string
                            enum: [float, int, bool, vector2, vector3, color, enum]
                          value:
                            description: Scalar, boolean, vector array, color array, or enum value name.
                          enum_path:
                            type: string
                            description: Required for enum values; object path to the UEnum.
              renderers:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                    class_path:
                      type: string
                      default: /Script/Niagara.NiagaraSpriteRendererProperties
                      description: UObject class path for renderer properties.
                    properties:
                      type: object
                      default: {}
                      description: Renderer properties accepted by UE 5.8's external editor schema.
    next-tools:
      on-success: [unreal_niagara__get_niagara_system_info, unreal_niagara__spawn_niagara_actor]
      on-failure: [dcc_diagnostics__audit_log]

  - name: create_niagara_system
    description: >-
      Create a new empty Niagara system asset. Returns the package path
      for use with other Niagara tools.
    source_file: scripts/create_niagara_system.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      required: [system_name]
      properties:
        system_name:
          type: string
          minLength: 1
          description: Name for the new Niagara system asset.
        package_path:
          type: string
          default: /Game/VFX
          description: Content Browser folder path (must start with /Game).
        emitter_template:
          type: string
          description: >-
            Reserved for future verified template support. Non-empty values
            fail closed instead of creating a different system than requested.
    next-tools:
      on-success: [unreal_niagara__spawn_niagara_actor]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]

  - name: spawn_niagara_actor
    description: >-
      Spawn a Niagara system as an actor in the current level at a
      specified location.
    source_file: scripts/spawn_niagara_actor.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 30
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      required: [niagara_system_path]
      properties:
        niagara_system_path:
          type: string
          minLength: 1
          description: Package path to the Niagara system asset.
        location_x:
          type: number
          default: 0.0
        location_y:
          type: number
          default: 0.0
        location_z:
          type: number
          default: 0.0
        auto_activate:
          type: boolean
          default: true
          description: Start the particle system immediately after spawning.
        label:
          type: string
          description: Optional World Outliner label for the actor.
    next-tools:
      on-success: [unreal_niagara__set_niagara_float_parameter, unreal_niagara__get_niagara_system_info]
      on-failure: [dcc_diagnostics__screenshot]

  - name: set_niagara_float_parameter
    description: >-
      Set a float parameter value on a Niagara component by name.
      Parameters must be exposed as user parameters in the Niagara system.
    source_file: scripts/set_niagara_float_parameter.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [actor_name, parameter_name, value]
      properties:
        actor_name:
          type: string
          minLength: 1
          description: Label or name of the Niagara actor in the level.
        parameter_name:
          type: string
          minLength: 1
          description: Name of the exposed float parameter.
        value:
          type: number
          description: Float value to set.

  - name: set_niagara_color_parameter
    description: >-
      Set a linear color parameter on a Niagara component. Colors are
      specified as [R, G, B, A] with values in 0.0–1.0 range.
    source_file: scripts/set_niagara_color_parameter.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [actor_name, parameter_name, color]
      properties:
        actor_name:
          type: string
          minLength: 1
          description: Label or name of the Niagara actor in the level.
        parameter_name:
          type: string
          minLength: 1
          description: Name of the exposed color parameter.
        color:
          type: array
          minItems: 3
          maxItems: 4
          items:
            type: number
            minimum: 0.0
            maximum: 1.0
          description: '[R, G, B] or [R, G, B, A] linear color values in 0-1 range.'

  - name: set_niagara_vector_parameter
    description: >-
      Set a 3D vector parameter on a Niagara component.
    source_file: scripts/set_niagara_vector_parameter.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [actor_name, parameter_name, vector]
      properties:
        actor_name:
          type: string
          minLength: 1
          description: Label or name of the Niagara actor in the level.
        parameter_name:
          type: string
          minLength: 1
          description: Name of the exposed vector parameter.
        vector:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: '[X, Y, Z] vector values.'

  - name: get_niagara_system_info
    description: >-
      Resolve a Niagara system asset or actor and report its verified asset
      path and component state. Unreal Python 5.8 does not expose emitter or
      module graph details; use the official Niagara toolsets for those.
    source_file: scripts/get_niagara_system_info.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 30
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [target]
      properties:
        target:
          type: string
          minLength: 1
          description: >-
            Either a Niagara system asset path (e.g. /Game/VFX/MySystem)
            or an actor label for a spawned Niagara actor in the level.
    next-tools:
      on-success: [unreal_niagara__set_niagara_float_parameter, unreal_niagara__reset_niagara_system]

  - name: reset_niagara_system
    description: >-
      Deactivate and reactivate a Niagara component to restart the
      particle simulation from its initial state. Useful during
      parameter iteration.
    source_file: scripts/reset_niagara_system.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      required: [actor_name]
      properties:
        actor_name:
          type: string
          minLength: 1
          description: Label or name of the Niagara actor in the level.
