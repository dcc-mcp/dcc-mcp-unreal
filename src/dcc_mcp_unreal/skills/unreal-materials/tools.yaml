tools:
  - name: create_material_instance
    description: Create a Material Instance from an existing Material or Material Instance parent.
    source_file: scripts/create_material_instance.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      required: [parent_material_path, instance_name]
      properties:
        parent_material_path:
          type: string
          minLength: 1
          description: Material or Material Instance object path used as the parent.
        destination_path:
          type: string
          default: /Game/Materials
        instance_name:
          type: string
          minLength: 1
        replace_existing:
          type: boolean
          default: false
    next-tools:
      on-success: [unreal_materials__set_material_instance_parameters, unreal_materials__assign_material]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]

  - name: set_material_instance_parameters
    description: Set scalar, vector, and texture parameters on a Material Instance with native transaction, save, and post-save verification.
    source_file: scripts/set_material_instance_parameters.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [instance_path]
      properties:
        instance_path:
          type: string
          minLength: 1
        scalar_parameters:
          type: object
          additionalProperties:
            type: number
          default: {}
        vector_parameters:
          type: object
          additionalProperties:
            type: array
            minItems: 3
            maxItems: 4
            items:
              type: number
          default: {}
        texture_parameters:
          type: object
          additionalProperties:
            type: string
          default: {}
    next-tools:
      on-success: [unreal_materials__assign_material]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]

  - name: assign_material
    description: Bind a Material Interface to a Static Mesh or Geometry Cache asset, or every primitive component on one level actor.
    source_file: scripts/assign_material.py
    execution: sync
    affinity: main
    enforce_thread_affinity: false
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [target_kind, target_path, material_path]
      properties:
        target_kind:
          type: string
          enum: [static_mesh, geometry_cache, actor]
        target_path:
          type: string
          minLength: 1
          description: Static Mesh or Geometry Cache object path, or exact level actor name/label.
        material_path:
          type: string
          minLength: 1
        slot_index:
          type: integer
          minimum: 0
          default: 0
    next-tools:
      on-success: [unreal_assets__get_asset_info]
      on-failure: [dcc_diagnostics__screenshot, dcc_diagnostics__audit_log]

  - name: connect_material_expression_to_customized_uv
    description: Connect one material-expression output to a numbered Customized UV input with native transaction, save, and post-save readback verification.
    source_file: scripts/connect_material_expression_to_customized_uv.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [material_path, source_expression_name, customized_uv_index]
      additionalProperties: false
      oneOf:
        - required: [source_output_index]
          not:
            required: [source_output_name]
        - required: [source_output_name]
          not:
            required: [source_output_index]
      properties:
        material_path:
          type: string
          minLength: 1
          description: Object path of a saved Material asset under /Game.
        source_expression_name:
          type: string
          minLength: 1
          description: Exact persistent UObject name of an expression owned by the material.
        source_output_index:
          type: integer
          minimum: 0
          description: Zero-based source output index; mutually exclusive with source_output_name.
        source_output_name:
          type: string
          minLength: 1
          description: Exact case-sensitive source output name; mutually exclusive with source_output_index.
        customized_uv_index:
          type: integer
          minimum: 0
          maximum: 7
          description: Zero-based Customized UV input index on the material root node.
        replace_existing:
          type: boolean
          default: false
          description: Explicitly replace a different connection already occupying this Customized UV input.
    next-tools:
      on-success: [unreal_assets__get_asset_info]
      on-failure: [dcc_diagnostics__audit_log]
