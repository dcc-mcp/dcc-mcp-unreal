tools:
  - name: inspect_pcg_graph
    description: Read complete bounded PCG graph topology, scalar settings and allowlisted spline grammar settings without editing, saving or generating.
    source_file: scripts/inspect_pcg_graph.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 15
    read_only: true
    destructive: false
    idempotent: true
    input_schema:
      type: object
      required: [asset_path]
      additionalProperties: false
      properties:
        asset_path:
          type: string
          pattern: '^/Game/(?:[A-Za-z0-9_]+/)*[A-Za-z0-9_]+$'
          maxLength: 240
        settings_names:
          type: array
          maxItems: 32
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,79}$'
    output_schema:
      type: object
      additionalProperties: true
    call_examples:
      - arguments:
          asset_path: /Game/PCG/Example
        note: Returned node paths and pin labels are the identities for subsequent edits.
  - name: edit_pcg_graph
    description: Explicitly create, add or update nodes, connect or disconnect pins, or save a PCG graph. No overwrite, automatic save, removal or generation.
    source_file: scripts/edit_pcg_graph.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    read_only: false
    destructive: false
    idempotent: false
    input_schema:
      type: object
      required: [operation, asset_path]
      additionalProperties: false
      properties:
        operation:
          type: string
          enum: [create, add_node, update_node, connect, disconnect, save]
        asset_path:
          type: string
          pattern: '^/Game/(?:[A-Za-z0-9_]+/)*[A-Za-z0-9_]+$'
          maxLength: 240
        node_id:
          type: string
          maxLength: 2048
        settings_class:
          type: string
          pattern: '^PCG[A-Za-z0-9_]+Settings$'
        position:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: -2147483648
            maximum: 2147483647
        settings:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: '^[a-z][a-z0-9_]{0,79}$'
          properties:
            grammar_selection:
              description: PCGSubdivideSplineSettings only. Text is preserved, not parsed. Named-attribute selection does not create or validate input spline data.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [grammar_as_attribute, grammar_string]
                  properties:
                    grammar_as_attribute: {const: false}
                    grammar_string: {type: string, minLength: 1, maxLength: 4096}
                - type: object
                  additionalProperties: false
                  required: [grammar_as_attribute, grammar_attribute]
                  properties:
                    grammar_as_attribute: {const: true}
                    grammar_attribute:
                      type: string
                      pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
            modules_info:
              description: PCGSubdivideSplineSettings only. Fixed modules require effective module_info_as_input=false. Size is in Unreal centimeters, not mesh bounds or fitted length.
              type: array
              minItems: 1
              maxItems: 128
              items:
                type: object
                additionalProperties: false
                required: [symbol, size, scalable]
                properties:
                  symbol: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'}
                  size: {type: number, exclusiveMinimum: 0, maximum: 1000000000}
                  scalable: {type: boolean}
                  debug_color:
                    type: array
                    minItems: 4
                    maxItems: 4
                    items: {type: number, minimum: 0, maximum: 1}
          additionalProperties:
            type: [boolean, integer, number, string]
        edge:
          type: object
          additionalProperties: false
          required: [from_node, from_pin, to_node, to_pin]
          properties:
            from_node: {type: string, minLength: 1, maxLength: 2048}
            from_pin: {type: string, minLength: 1, maxLength: 256}
            to_node: {type: string, minLength: 1, maxLength: 2048}
            to_pin: {type: string, minLength: 1, maxLength: 256}
        settings_names:
          type: array
          maxItems: 32
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,79}$'
    output_schema:
      type: object
      additionalProperties: true
    call_examples:
      - arguments:
          operation: create
          asset_path: /Game/PCG/NewGraph
        note: Creates an unsaved graph only if the explicit path is unused. Inspect before retrying any uncertain outcome.
