[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-unreal"
version = "0.2.7"
description = "Unreal Engine plugin for the DCC Model Context Protocol (MCP) ecosystem — embeds a Streamable HTTP MCP server directly inside Unreal Engine"
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["unreal", "unreal-engine", "mcp", "dcc", "ai", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "dcc-mcp-core>=0.19.45,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.8.0",
    "hatchling",
    "build",
    "tomli; python_version < '3.11'",
    "pyyaml>=5.0",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-unreal"
Repository = "https://github.com/dcc-mcp/dcc-mcp-unreal"
Issues = "https://github.com/dcc-mcp/dcc-mcp-unreal/issues"
Changelog = "https://github.com/dcc-mcp/dcc-mcp-unreal/releases"

[project.entry-points."dcc_mcp.adapters"]
unreal = "dcc_mcp_unreal:UnrealMcpServer"

[project.scripts]
dcc-mcp-unreal-standalone = "dcc_mcp_unreal._standalone_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_unreal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: end-to-end tests that require a real Unreal Engine instance",
]

[tool.coverage.run]
source = ["dcc_mcp_unreal"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dcc_mcp_unreal"]
