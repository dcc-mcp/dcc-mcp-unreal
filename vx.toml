[project]
name = "dcc-mcp-unreal"
description = "Unreal Engine plugin for dcc-mcp — Python + C++ native bridge"

[tools]
python = "3.12"
# MSVC toolchain is managed by Visual Studio Build Tools, not directly by vx.
# Engine-local UBT configuration owns compatibility. Explicit pins must be
# provisioned before building; CI does not modify global Visual Studio installs.

[env]
UE_5_ROOT = "C:\\Program Files\\Epic Games\\UE_5.7"
UE_5_2_ROOT = "C:\\Program Files\\Epic Games\\UE_5.2"
UE_4_ROOT = "C:\\Program Files\\Epic Games\\UE_4.18"
UE_4_26_ROOT = "F:\\UE\\UE_4.26"

[scripts]
# Build for each UE version using the host Python (set up by CI or `vx setup`)
build-ue5.7 = "python packaging/build_distributable.py --ue-root \"${UE_5_ROOT}\" --mode native"
build-ue5.2 = '''
python packaging/build_distributable.py --ue-root "${UE_5_2_ROOT}" --mode native --vctoolchain-version "14.36"
'''
build-ue4.18 = "python packaging/build_distributable.py --ue-root \"${UE_4_ROOT}\" --mode python-only"
build-ue4.26 = "python packaging/build_distributable.py --ue-root \"${UE_4_26_ROOT}\" --mode native"
