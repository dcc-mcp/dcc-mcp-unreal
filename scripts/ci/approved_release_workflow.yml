name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to rebuild exactly. Leave empty to only run release-please."
        required: false
        default: ""
      core_version:
        description: "dcc-mcp-core release tag/version to download, for example v0.20.13"
        required: false
        default: "latest"

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == '')
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  prepare-release:
    needs: [release-please]
    if: |
      always() &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      publish_pypi: ${{ steps.resolve.outputs.publish_pypi }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable release source
        id: resolve
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag_name || '' }}
        run: |
          python scripts/release_guard.py resolve-source \
            --repo . \
            --tag "$REQUESTED_TAG" \
            --event-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Export release guard
        if: steps.resolve.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tools
          path: scripts/release_guard.py
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact release source
        env:
          RELEASE_MODE: ${{ needs.prepare-release.outputs.mode }}
          RELEASE_GUARD: ${{ runner.temp }}/release-tools/release_guard.py
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          tag_args=()
          if [ "$RELEASE_MODE" = recovery ]; then tag_args+=(--require-tag); fi
          python "$RELEASE_GUARD" verify-source \
            --repo . \
            --tag "$RELEASE_TAG" \
            --expected-sha "$SOURCE_SHA" \
            "${tag_args[@]}"
      - name: Install build tools
        run: pip install hatchling build
      - name: Run tests
        run: |
          pip install ".[dev]"
          pytest tests/ -v --tb=short
      - name: Build wheel and sdist
        run: python -m build
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  build-unreal-plugin:
    needs: [prepare-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/build-uplugin.yml
    with:
      core_version: ${{ github.event.inputs.core_version || 'latest' }}
      source_sha: ${{ needs.prepare-release.outputs.source_sha }}
      release_tag: ${{ needs.prepare-release.outputs.tag_name }}
      require_existing_tag: ${{ needs.prepare-release.outputs.mode == 'recovery' }}
    secrets: inherit

  standalone:
    needs: [prepare-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, core_asset: dcc-mcp-server-linux-x86_64, server_name: dcc-mcp-server, asset_suffix: linux-X64}
          - {os: windows-latest, core_asset: dcc-mcp-server-windows-x86_64.exe, server_name: dcc-mcp-server.exe, asset_suffix: windows-X64}
          - {os: macos-latest, core_asset: dcc-mcp-server-macos-universal2, server_name: dcc-mcp-server, asset_suffix: macOS-Universal2}
    runs-on: ${{ matrix.os }}
    env:
      DCC_MCP_SOURCE_COMMIT: ${{ needs.prepare-release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact release source
        env:
          RELEASE_MODE: ${{ needs.prepare-release.outputs.mode }}
          RELEASE_GUARD: ${{ runner.temp }}/release-tools/release_guard.py
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        shell: bash
        run: |
          tag_args=()
          if [ "$RELEASE_MODE" = recovery ]; then tag_args+=(--require-tag); fi
          python "$RELEASE_GUARD" verify-source \
            --repo . \
            --tag "$RELEASE_TAG" \
            --expected-sha "$SOURCE_SHA" \
            "${tag_args[@]}"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pyoxidizer==0.24.0
      - name: Download native core sidecar
        env:
          GH_TOKEN: ${{ secrets.DCC_MCP_CORE_READ_TOKEN || secrets.GITHUB_TOKEN }}
          CORE_VERSION: ${{ github.event.inputs.core_version || 'latest' }}
          CORE_ASSET: ${{ matrix.core_asset }}
          SERVER_NAME: ${{ matrix.server_name }}
        shell: bash
        run: |
          args=(--repo dcc-mcp/dcc-mcp-core --pattern "$CORE_ASSET" --dir core-bin)
          if [ "$CORE_VERSION" = latest ]; then
            found=false
            while read -r tag; do
              if gh release download "$tag" "${args[@]}" 2>/dev/null; then
                found=true
                echo "Using dcc-mcp-core $tag"
                break
              fi
            done < <(gh release list --repo dcc-mcp/dcc-mcp-core --limit 20 --json tagName --jq '.[].tagName')
            if [ "$found" != true ]; then
              echo "::error::No recent dcc-mcp-core release contains $CORE_ASSET"
              exit 1
            fi
          else
            gh release download "$CORE_VERSION" "${args[@]}"
          fi
          mv "core-bin/$CORE_ASSET" "core-bin/$SERVER_NAME"
          chmod +x "core-bin/$SERVER_NAME" || true
      - name: Build standalone sidecar
        env:
          SERVER_NAME: ${{ matrix.server_name }}
        run: python tools/build_binary.py --server "core-bin/$SERVER_NAME"
      - name: Embed portable release identity
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          identity = {
              "source_commit": os.environ["DCC_MCP_SOURCE_COMMIT"],
              "tag_name": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_VERSION"],
          }
          Path("dist/standalone/RELEASE_INFO.json").write_text(
              json.dumps(identity, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Archive standalone
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          RUNNER_OS_NAME: ${{ runner.os }}
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            "")
              echo "::error::RELEASE_TAG is empty"
              exit 1
              ;;
            *[!A-Za-z0-9._+-]*)
              echo "::error::RELEASE_TAG may only contain [A-Za-z0-9._+-]"
              printf '  got: %q\n' "$RELEASE_TAG"
              exit 1
              ;;
          esac
          base="dcc-mcp-unreal-${RELEASE_TAG}-${ASSET_SUFFIX}"
          if [ "$RUNNER_OS_NAME" = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/standalone/*' -DestinationPath '${base}.zip'"
            asset="${base}.zip"
          else
            tar -czf "${base}.tar.gz" -C dist/standalone .
            asset="${base}.tar.gz"
          fi
          delimiter="ASSET_EOF_$$_${RANDOM}${RANDOM}"
          echo "ASSET<<$delimiter" >> "$GITHUB_ENV"
          printf '%s\n' "$asset" >> "$GITHUB_ENV"
          echo "$delimiter" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: [prepare-release, build]
    if: |
      always() &&
      needs.prepare-release.outputs.should_release == 'true' &&
      needs.prepare-release.outputs.publish_pypi == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcc-mcp-unreal
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - name: Plan immutable PyPI publication
        id: pypi
        env:
          RELEASE_GUARD: ${{ runner.temp }}/release-tools/release_guard.py
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          python "$RELEASE_GUARD" plan-pypi \
            --dist-dir dist \
            --project dcc-mcp-unreal \
            --version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish to PyPI with trusted publishing
        if: steps.pypi.outputs.publish_needed == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true
      - name: Verify exact PyPI distributions
        env:
          RELEASE_GUARD: ${{ runner.temp }}/release-tools/release_guard.py
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            if python "$RELEASE_GUARD" plan-pypi \
              --dist-dir dist \
              --project dcc-mcp-unreal \
              --version "$RELEASE_VERSION" \
              --require-existing; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  finalize-release:
    needs: [prepare-release, build, publish, build-unreal-plugin, standalone]
    if: |
      always() &&
      needs.prepare-release.outputs.should_release == 'true' &&
      needs.build.result == 'success' &&
      needs.build-unreal-plugin.result == 'success' &&
      needs.standalone.result == 'success' &&
      (
        needs.publish.result == 'success' ||
        (needs.prepare-release.outputs.mode == 'recovery' && needs.publish.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: staged/python-dist
      - uses: actions/download-artifact@v4
        with:
          pattern: DccMcpUnreal-*
          path: staged/unreal-plugin
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: staged/standalone
          merge-multiple: true
      - name: Verify staged release identities
        env:
          RELEASE_GUARD: ${{ runner.temp }}/release-tools/release_guard.py
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        shell: bash
        run: |
          python "$RELEASE_GUARD" verify-source \
            --repo . \
            --tag "$RELEASE_TAG" \
            --expected-sha "$SOURCE_SHA"
          count=0
          for archive in staged/unreal-plugin/DccMcpUnreal-*.zip; do
            name=$(basename "$archive")
            if [[ "$name" =~ ^DccMcpUnreal-[0-9]+\.[0-9]+\.[0-9]+-(ue(4|5)\.[0-9]+)-(win64|source|python-only)\.zip$ ]]; then
              engine_tag="${BASH_REMATCH[1]}"
            else
              echo "::error::Unexpected Unreal plugin archive name: $name"
              exit 1
            fi
            python "$RELEASE_GUARD" verify-plugin-archive \
              --archive "$archive" \
              --tag "$RELEASE_TAG" \
              --source-sha "$SOURCE_SHA" \
              --engine-tag "$engine_tag"
            count=$((count + 1))
          done
          if [ "$count" -ne 6 ]; then
            echo "::error::Expected six Unreal matrix archives, found $count"
            exit 1
          fi
      - name: Stage release assets
        id: stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
          RELEASE_GUARD: ${{ runner.temp }}/release-tools/release_guard.py
        shell: bash
        run: |
          mkdir -p release-assets existing-assets
          copy_unique() {
            source="$1"
            destination="release-assets/$(basename "$source")"
            if [ -e "$destination" ]; then
              echo "::error::Duplicate staged asset name: $(basename "$source")"
              exit 1
            fi
            cp "$source" "$destination"
          }
          while IFS= read -r -d '' file; do copy_unique "$file"; done < <(find staged/python-dist -maxdepth 2 -type f -print0)
          while IFS= read -r -d '' file; do copy_unique "$file"; done < <(find staged/unreal-plugin -type f -name '*.zip' -print0)
          while IFS= read -r -d '' file; do copy_unique "$file"; done < <(find staged/standalone -maxdepth 2 -type f -print0)
          copy_unique scripts/install-standalone.ps1
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            tagged=$(git rev-parse "refs/tags/$TAG_NAME^{commit}")
            if [ "$tagged" != "$SOURCE_SHA" ]; then
              echo "::error::Existing release tag points to $tagged, expected $SOURCE_SHA"
              exit 1
            fi
            asset_count=$(gh release view "$TAG_NAME" --json assets --jq '.assets | length')
            if [ "$asset_count" -gt 0 ]; then
              gh release download "$TAG_NAME" --dir existing-assets
            fi
          else
            remote_tag=$(git ls-remote --tags origin "refs/tags/$TAG_NAME")
            if [ -n "$remote_tag" ]; then
              echo "::error::Tag exists without a recoverable GitHub release: $TAG_NAME"
              exit 1
            fi
            gh release create "$TAG_NAME" --draft --target "$SOURCE_SHA" --title "$TAG_NAME" --generate-notes
          fi
          python "$RELEASE_GUARD" plan-assets \
            --local-dir release-assets \
            --existing-dir existing-assets > asset-plan.json
      - name: Upload missing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        shell: bash
        run: |
          python -c 'import json; [print(name) for name in json.load(open("asset-plan.json", encoding="utf-8"))["upload"]]' |
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            gh release upload "$TAG_NAME" "release-assets/$name"
          done
      - name: Verify uploaded release asset bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          RELEASE_GUARD: ${{ runner.temp }}/release-tools/release_guard.py
        shell: bash
        run: |
          mkdir verified-assets
          gh release download "$TAG_NAME" --dir verified-assets
          python "$RELEASE_GUARD" plan-assets \
            --local-dir release-assets \
            --existing-dir verified-assets > verified-plan.json
          python -c 'import json, sys; plan=json.load(open("verified-plan.json", encoding="utf-8")); sys.exit(0 if not plan["upload"] else 1)'
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          tagged=$(git rev-parse "refs/tags/$TAG_NAME^{commit}")
          if [ "$tagged" != "$SOURCE_SHA" ]; then
            echo "::error::Release tag identity changed before publication"
            exit 1
          fi
          gh release edit "$TAG_NAME" --draft=false --latest
